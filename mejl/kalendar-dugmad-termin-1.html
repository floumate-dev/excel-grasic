<!-- ============================================================
     Dugmad "dodaj u kalendar" - termin 1 (cetvrtak 26.11.2026. u 19 h)

     Svaki link vodi na nasu stranicu /kalendar/, koja od parametara
     sklopi termin i posalje posetioca u njegov kalendar. Apple i ICS
     dobijaju .ics fajl napravljen u pregledacu, bez servera.

     PAZI NA DVE STVARI:

     1. z=%ZOOM_JOIN_LINK% MORA da ostane zadnji parametar u linku.
        Zoom linkovi u sebi nose ? i &, pa se vrednost cita sve do
        kraja adrese. Ako posle z= dodas jos nesto, link se prelomi.

     2. t=1 govori koji je termin. Za drugi termin je t=2 i menja se
        na svih 12 mesta (6 dugmadi puta dva, jer Outlook ima svoju
        kopiju linka u VML bloku). Zato postoji drugi fajl.

     Ikonice privremeno stoje na addcal.co. Kad se presele u repo,
     zameniti "https://addcal.co/static/cals/" sa
     "https://floumate-dev.github.io/excel-grasic/kalendar/ikone/".
     ============================================================ -->
